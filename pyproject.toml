[project]
name = "podtrack"
version = "0.6.2"
description = "Ownership-aware RunPod pod registry and autonomous reaper for shared accounts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Efithor", email = "efithor@gmail.com" }]
keywords = ["runpod", "gpu", "gpu-cloud", "cloud-gpu", "cost-control", "cost-optimization",
            "infrastructure", "reaper", "idle-detection", "dead-man-switch", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Efithor/podtrack"
Repository = "https://github.com/Efithor/podtrack"
Issues = "https://github.com/Efithor/podtrack/issues"
"Author's Site" = "https://www.nodeorange.com/"

[project.scripts]
podtrack = "podtrack:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["podtrack"]
